# Block unwanted crawlers before filesystem or reverse-proxy handling.
ErrorDocument 403 default
RewriteEngine On
RewriteCond %{HTTP_USER_AGENT} (GPTBot|ClaudeBot|Claude-Web|CCBot|Google-Extended|Amazonbot|Applebot-Extended|cohere-ai|Diffbot|Omgilibot|FacebookBot|PetalBot|amilabs|Sogou\ web\ spider|bytespider|zgrab|dotbot|xploit_probe|ALittle\ Client|CensysInspect|MJ12bot|coccocbot-web|yacybot|Amzn-SearchBot|wp2shell|reflectionbot|ant-html|Baiduspider|WanScannerBot|OptimizifyBot|python-requests) [NC]
RewriteRule ^ - [F,L]
# Replace any client-supplied identity used by the media API limiter.
RequestHeader unset X-Breslov-Client-IP
RequestHeader set X-Breslov-Client-IP "expr=%{REMOTE_ADDR}"
